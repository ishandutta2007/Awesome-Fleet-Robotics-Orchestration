<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Animated / Dynamic Graphic Elements (Background Layer) -->
  <g opacity="0.6">
    <!-- Pulse Rings -->
    <circle cx="950" cy="200" r="140" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0 950 200" to="360 950 200" dur="30s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="200" r="100" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="360 950 200" to="0 950 200" dur="20s" repeatCount="indefinite" />
    </circle>

    <!-- Node Network Lines -->
    <path d="M 750 120 L 850 180 L 950 120 L 1050 220 L 950 280 L 850 240 Z" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite" />
    </path>

    <!-- Dynamic Signal Particles -->
    <circle cx="850" cy="180" r="6" fill="#3b82f6" filter="url(#glow)">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="120" r="6" fill="#8b5cf6" filter="url(#glow)">
      <animate attributeName="r" values="6;10;6" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="220" r="6" fill="#ec4899" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="280" r="6" fill="#10b981" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Moving Telemetry Pulse -->
    <circle cx="750" cy="120" r="4" fill="#60a5fa">
      <animate attributeName="cx" values="750;850;950;1050;950;850;750" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;180;120;220;280;240;120" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Text & Branding (Prominently Overlayed, Always Crisp) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <rect x="0" y="75" width="280" height="34" rx="17" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="140" y="97" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" text-anchor="middle">
      🤖 ROBOTICS &amp; AUTONOMY
    </text>

    <!-- Main Title -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Fleet Robotics
    </text>
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Orchestration Ecosystem
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9ca3af" width="600">
      Curated Multi-Vendor Fleet Management, OpenRobOps, Open-RMF,
    </text>
    <text x="0" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9ca3af">
      Spatial Intelligence, Autonomy Middleware &amp; Warehouse Robotics
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 325)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="65" y="18" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Multi-Vendor</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="120" height="28" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="202" y="18" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">ROS 2 / RMF</text>

      <!-- Tag 3 -->
      <rect x="274" y="0" width="130" height="28" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="339" y="18" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">OpenRobOps</text>
    </g>
  </g>
</svg>
